[package]
name = "rust-game-dev-env"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
quad-rand = {version = "0.2.3"}
quad-url = "0.1.2"
egui-macroquad = {version = "0.17.3"}
puffin = "0.20.0"

[profile.dev.package.'*']
opt-level = 3
