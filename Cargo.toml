[package]
name = "rust-game-dev-env"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
bincode = "1.3"

quad-rand = {version = "0.2.3"}
quad-url = "0.1.2"
egui-macroquad = {version = "0.17.3"}
puffin = "0.20.0"
num-bigint = "0.4.6"

[dev-dependencies]
trybuild = "1.0.116"
macrotest = "1.2.1"


[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 1


[profile.release]
opt-level = 3    
lto = true         
codegen-units = 1  

