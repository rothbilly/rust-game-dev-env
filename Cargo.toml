[package]
name = "rust-game-dev-env"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = {version = "0.4.15", default-features = false}
quad-rand = {version = "0.2.3"}
quad-url = "0.1.2"
egui-macroquad = {version = "0.17.3", default-features = false}

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
bincode = "1.3"

num-bigint = "0.5.1"


puffin = {version = "0.20.0", default-features = false }
resvg = {version = "0.47.0", default-features = false}

inventory = "0.3.24"
automod = "1.0.17"
engine_macros = {path = "engine_macros"}



[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 1            
debug = "line-tables-only" 
split-debuginfo = "unpacked" 
codegen-units = 256      
incremental = true       


[profile.release]
opt-level = 3    
lto = true         
codegen-units = 16  
debug = false
