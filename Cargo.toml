[package]
name = "rust-game-dev-env"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
bincode = "1.3"

quad-rand = {version = "0.2.3"}
quad-url = "0.1.2"
num-bigint = "0.4.6"


egui-macroquad = {version = "0.17.3"}

inventory = "0.3.24"

engine_macros = {path = "engine_macros"}
automod = "1.0.17"

# frunk = { version = "0.4.4"}
# frunk_core = { version = "0.4.4" }

[dev-dependencies]



[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 1


[profile.release]
opt-level = 3    
lto = true         
codegen-units = 1  

