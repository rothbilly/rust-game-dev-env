[package]
name = "macroquack"
version = "0.1.0"
edition = "2024"

[dependencies]


macroquad = {workspace = true}
quad-rand = {version = "0.2.3"}
quad-url = "0.1.2"
egui-macroquad = {version = "0.17.3", default-features = false}

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
bincode = "1.3"

num-bigint = "0.5.1"


puffin = {version = "0.20.0", default-features = false }
resvg = {version = "0.47.0", default-features = false}
hecs = {version = "0.11.0", default-features = false}



inventory = {workspace = true}
engine_macros = {path = "../engine_macros"}



[profile.dev.package.'*']
opt-level = 3 


[profile.release]
opt-level = 3    
lto = true         
codegen-units = 16  
debug = false
